<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khatib Polyclinic Phone Directory</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(180deg,#fbfcfe 0%,#f7f9fc 100%);
  color:#17324d;
}
.container{max-width:1180px;margin:auto;padding:52px 28px 38px}
h1{
  text-align:center;margin:0;color:#075ca8;font-size:48px;
  line-height:1.1;font-weight:750;letter-spacing:-1px;
}
.notice{text-align:center;color:#66758a;font-size:22px;margin:14px 0 38px}
.notice strong{color:#3f5570}
.search-panel{display:flex;gap:12px;align-items:stretch}
.search-wrap{
  position:relative;flex:1;background:white;border:1px solid #d7e2ef;
  border-radius:15px;box-shadow:0 2px 7px rgba(35,67,102,.05)
}
.search-icon{
  position:absolute;left:24px;top:50%;transform:translateY(-50%);
  width:25px;height:25px;border:3px solid #173d66;border-radius:50%;
}
.search-icon:after{
  content:"";position:absolute;width:12px;height:3px;background:#173d66;
  right:-9px;bottom:-5px;transform:rotate(45deg);border-radius:3px;
}
#searchBox{
  width:100%;height:76px;border:0;outline:0;background:transparent;
  padding:0 24px 0 72px;font-size:23px;color:#17324d;border-radius:15px;
}
#searchBox::placeholder{color:#8793a4}
.clear-btn{
  min-width:132px;border:0;border-radius:15px;background:#075ca8;color:white;
  font-size:21px;font-weight:700;cursor:pointer;padding:0 28px;
  box-shadow:0 3px 8px rgba(7,92,168,.14)
}
.clear-btn:hover{background:#064f91}
.smart-card{
  margin-top:22px;padding:27px 35px;border-radius:18px;
  background:linear-gradient(100deg,#eaf5ff,#f4f8ff);
  display:grid;grid-template-columns:95px 1fr 1.15fr;align-items:center;
  box-shadow:inset 0 0 0 1px rgba(77,145,205,.06)
}
.bulb{font-size:50px;text-align:center}
.tip-left{padding:0 34px 0 12px;border-right:1px solid #bfd9ed}
.tip-title{font-size:21px;font-weight:750;color:#075a9e;margin-bottom:8px}
.tip-text,.tip-right{font-size:18px;line-height:1.55;color:#344b64}
.tip-right{padding-left:48px}
.tip-text strong,.tip-right strong{color:#124f84}
.department-grid{
  margin-top:22px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;
}
.dept-btn{
  border:1px solid rgba(70,110,150,.05);border-radius:16px;min-height:82px;
  padding:13px 12px;cursor:pointer;font-size:17px;color:#17324d;
  display:flex;align-items:center;justify-content:center;gap:11px;
  transition:.15s ease;box-shadow:0 2px 6px rgba(30,70,110,.035)
}
.dept-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(30,70,110,.10)}
.dept-btn.active{outline:3px solid rgba(7,92,168,.18);font-weight:700}
.dept-icon{font-size:27px}
.lab{background:#e9f5ff} .xray{background:#fff3e8} .msw{background:#e9f8ef}
.physio{background:#fff0f3} .pharmacy{background:#f1efff} .diagnostic{background:#eaf7f8}
.nursing{background:#fff7e6} .operations{background:#f0f1fb} .housekeeping{background:#f7f0e8} .sos{background:#ffe8ef;color:#9b3151;font-weight:700}
.cisco{background:#eaf8f8} .others{background:#f2f3f5}
.results-header{margin:28px 2px 12px;color:#64768a;font-size:14px}
.result{
  background:white;border-radius:14px;padding:17px 20px;margin-bottom:11px;
  box-shadow:0 2px 8px rgba(29,58,88,.07);border:1px solid #edf1f6;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
}
.category{font-size:11px;color:#78889a;text-transform:uppercase;letter-spacing:.7px}
.title{font-size:19px;font-weight:700;color:#173d66;margin-top:3px}
.ext{font-size:29px;color:#d65020;font-weight:800;text-align:right}
.desc{margin-top:6px;color:#66778a;font-size:14px}
.noresult{text-align:center;color:#8793a4;padding:28px 10px}
.footer{text-align:center;color:#758396;font-size:14px;margin-top:42px}
@media(max-width:900px){
  .department-grid{grid-template-columns:repeat(3,1fr)}
  .smart-card{grid-template-columns:70px 1fr}
  .tip-right{grid-column:1/-1;padding:18px 0 0 82px}
  .tip-left{border-right:0}
}
@media(max-width:600px){
  .container{padding:30px 16px}
  h1{font-size:34px}
  .notice{font-size:17px;margin-bottom:25px}
  #searchBox{height:64px;font-size:18px;padding-left:58px}
  .search-icon{left:19px}
  .clear-btn{min-width:90px;font-size:17px;padding:0 15px}
  .smart-card{display:block;padding:22px}
  .bulb{text-align:left;font-size:38px;margin-bottom:8px}
  .tip-left{padding:0}
  .tip-right{padding:13px 0 0}
  .department-grid{grid-template-columns:repeat(2,1fr)}
  .dept-btn{min-height:68px}
  .result{grid-template-columns:1fr}
  .ext{text-align:left}
}

/* Department buttons — matched to reference design */
.department-grid .dept-btn{
  background:#dff3ea;
  color:#064e63;
  font-weight:700;
  border:1px solid rgba(44,120,100,.04);
}
.department-grid .dept-btn:hover{

}
.department-grid .dept-btn.sos{
  background:#f9dfe7;
  color:#8f2948;
}
.department-grid .dept-btn.sos:hover{
  background:#f5d3de;
}

</style>

const resultsDiv = document.getElementById("results");
const searchBox = document.getElementById("searchBox");
const buttons = [...document.querySelectorAll(".dept-btn")];

function roomObject(item){
  return {
    type:"Room", title:item.name, ext:item.ext,
    info:"Room Search Code: " + item.code + (item.desc ? " · " + item.desc : ""),
    raw:item
  };
}

function serviceObject(item){
  return {type:"Service",title:item.name,ext:item.ext,info:item.desc,raw:item};
}

function allItems(){
  return [...rooms.map(roomObject), ...services.map(serviceObject)];
}

function matchesKeyword(r, keyword){
  const raw = r.raw;
  const haystack = [
    r.title, r.ext, r.info,
    raw.code || "", raw.name || "", raw.desc || "", raw.tags || ""
  ].join(" ").toLowerCase();
  return haystack.includes(keyword.toLowerCase());
}

function render(results, label=""){
  if(!results.length){
    resultsDiv.innerHTML='<div class="noresult">No matching records found.</div>';
    return;
  }
  resultsDiv.innerHTML =
    (label ? `<div class="results-header">${label} · ${results.length} result${results.length===1?"":"s"}</div>` : "") +
    results.map(r=>`
      <div class="result">
        <div>
          <div class="category">${r.type}</div>
          <div class="title">${r.title}</div>
          <div class="desc">${r.info}</div>
        </div>
        <div class="ext">${r.ext}</div>
      </div>
    `).join("");
}

function searchDirectory(){
  buttons.forEach(b=>b.classList.remove("active"));
  const keyword=searchBox.value.trim().toLowerCase();
  if(!keyword){
    resultsDiv.innerHTML='<div class="noresult">Start typing or choose a department.</div>';
    return;
  }
  render(allItems().filter(r=>matchesKeyword(r,keyword)), `Search: ${searchBox.value.trim()}`);
}

function departmentResults(type){
  const all=allItems();
  if(type==="diagnostic"){
    const words=["lab","laboratory","x-ray","xray","ultrasound","diagnostic"];
    return all.filter(r=>words.some(w=>matchesKeyword(r,w)));
  }
  if(type==="nursing"){
    const words=[
      "nursing","nurse","treatment","resus","vaccination","immunization",
      "dressing","dfs","drp","segregation","dots","care coach","cc room",
      "care manager","cm room"
    ];
    return all.filter(r=>{
      const isNursing = words.some(w=>matchesKeyword(r,w));
      const isDental = matchesKeyword(r,"dental");
      return isNursing && !isDental;
    });
  }
  return [];
}

buttons.forEach(btn=>{

    if(keyword){
      searchBox.value=keyword;
      render(allItems().filter(r=>matchesKeyword(r,keyword)), btn.textContent.trim());
    } else {
      searchBox.value="";
      render(departmentResults(filter), btn.textContent.trim());
    }
    resultsDiv.scrollIntoView({behavior:"smooth",block:"start"});
  });
});

function clearSearch(){
  searchBox.value="";
  buttons.forEach(b=>b.classList.remove("active"));
  resultsDiv.innerHTML='<div class="noresult">Start typing or choose a department.</div>';
  searchBox.focus();
}

searchBox.addEventListener("input",searchDirectory);
clearSearch();
</script>
</body>
</html>
